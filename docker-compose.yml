services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/YOLOv11s_Pothole_Trained.pt
      - FRONTEND_ORIGINS=*
    volumes:
      - ./backend/YOLOv11s_Pothole_Trained.pt:/app/YOLOv11s_Pothole_Trained.pt:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
