services:
  - type: web
    name: pothole-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false